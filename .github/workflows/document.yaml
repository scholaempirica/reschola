# Fails when man/ or NAMESPACE are out of date with the roxygen comments in R/.
# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

name: document

permissions: read-all

jobs:
  document:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::roxygen2
          needs: roxygen2

      - name: Install the roxygen2 version in RoxygenNote
        run: |
          v <- read.dcf("DESCRIPTION", "RoxygenNote")[1]
          if (!is.na(v)) pak::pkg_install(paste0("roxygen2@", v))
        shell: Rscript {0}

      - name: Document
        run: roxygen2::roxygenise()
        shell: Rscript {0}

      - name: Check that man/ and NAMESPACE are up to date
        run: |
          changes=$(git status --porcelain -- man NAMESPACE DESCRIPTION)
          if [ -n "$changes" ]; then
            echo "$changes"
            git --no-pager diff -- man NAMESPACE DESCRIPTION
            echo "::error::man/ or NAMESPACE are out of date. Run devtools::document() and commit the result."
            exit 1
          fi
